version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    groups:
      actions-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
  - package-ecosystem: "gomod"
    directories:
      - /src/**/*
      - /internal/tools/**/*
      - /internal/tools
      - /src/checkout
      - /src/product-catalog
    groups:
      go-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:05"
  - package-ecosystem: "gradle"
    directories:
      - "/src/**/*"
    exclude-paths:
      - "src/react-native-app/**"
    groups:
      gradle-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:10"
  - package-ecosystem: "pip"
    directories:
      - /src/**/*
      - /src/llm
      - /src/load-generator
      - /src/product-reviews
      - /src/recommendation
    groups:
      pip-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:15"
  - package-ecosystem: "nuget"
    directories:
      - "/src/**/*"
    groups:
      nuget-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:20"
  - package-ecosystem: "composer"
    directories:
      - "/src/**/*"
    groups:
      composer-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:25"
  - package-ecosystem: "npm"
    directories:
      - /
      - /src/frontend/*
      - /src/payment/*
      - /src/frontend
      - /src/payment
      - /src/react-native-app
    groups:
      npm-production-dependencies:
        dependency-type: "production"
      npm-development-dependencies:
        dependency-type: "development"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:30"
  - package-ecosystem: "cargo"
    directories:
      - "/src/shipping/*"
    groups:
      cargo-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:35"
    allow:
      - dependency-type: "all"
  - package-ecosystem: "bundler"
    directories:
      - "/src/email/*"
    groups:
      bundler-production-dependencies:
        dependency-type: "production"
      bundler-development-dependencies:
        dependency-type: "development"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:40"
    allow:
      - dependency-type: "all"
  - package-ecosystem: "mix"
    directories:
      - "/src/flagd-ui/*"
    groups:
      mix-production-dependencies:
        dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:45"

  - package-ecosystem: docker
    directory: /src/accounting
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/ad
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/cart/src
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/checkout
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/checkout/genproto
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/currency
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/currency/genproto
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/email
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/flagd-ui
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/fraud-detection
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/frontend-proxy
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/frontend/genproto
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/image-provider
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/kafka
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/llm
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/load-generator
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/opensearch
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/payment
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/product-catalog
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/product-catalog/genproto
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/product-reviews
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/product-reviews/genproto
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/quote
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/recommendation
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/recommendation/genproto
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/shipping
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/telemetry-docs
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /test/tracetesting
    schedule:
      interval: weekly

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Build Android APK
        run: make build-react-native-android

      - name: Verify APK was created
        run: |
          if [ ! -f reactnativeapp.apk ]; then
            echo "APK build failed"
            exit 1
          fi
          echo "APK size: $(du -h reactnativeapp.apk | cut -f1)"
